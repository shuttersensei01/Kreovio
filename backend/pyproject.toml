[project]
name = "kreovio-backend"
version = "0.1.0"
description = "AI-assisted client journey platform for creative businesses"
requires-python = ">=3.12"
dependencies = [
  "argon2-cffi>=23.1.0",
  "celery[redis]>=5.4.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pydantic-settings>=2.6.0",
  "pymongo>=4.10.0",
  "python-jose[cryptography]>=3.3.0",
  "redis>=5.2.0",
  "structlog>=24.4.0",
  "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
  "hypothesis>=6.118.0",
  "mypy>=1.13.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.7.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "unit: unit test",
  "integration: requires infrastructure",
  "e2e: end-to-end test",
  "concurrency: concurrency test",
  "security: security test",
  "ai_eval: AI evaluation",
  "live: requires live external service",
]
addopts = "--strict-markers -m 'not live'"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ["."]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

