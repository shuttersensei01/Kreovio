name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cd backend && uv sync --all-groups
      - run: cd backend && uv run ruff check .
      - run: cd backend && uv run mypy app
      - run: cd backend && uv run pytest --junitxml=../junit.xml --cov=app --cov-report=xml:../coverage.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-artifacts
          path: |
            junit.xml
            coverage.xml
